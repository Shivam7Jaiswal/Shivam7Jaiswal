<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="55%" stop-color="#0B1626"/>
      <stop offset="100%" stop-color="#0F2233"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1000" cy="80" r="220" fill="url(#glowSpot)"/>
  <circle cx="180" cy="260" r="180" fill="url(#glowSpot)"/>

  <g stroke="#123047" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="60" y1="0" x2="60" y2="300"/>
    <line x1="1140" y1="0" x2="1140" y2="300"/>
  </g>

  <g stroke="#144056" stroke-width="1.5" opacity="0.6" fill="none">
    <path d="M 60 60 L 60 40 L 100 40"/>
    <path d="M 1140 240 L 1140 260 L 1100 260"/>
    <circle cx="100" cy="40" r="3" fill="#0891B2"/>
    <circle cx="1100" cy="260" r="3" fill="#0891B2"/>
  </g>

  <text x="90" y="98" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="22" fill="#0891B2" opacity="0.85">&lt;developer&gt;</text>

  <text x="88" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#textGlow)" filter="url(#softGlow)">Shivam Jaiswal</text>

  <text x="90" y="212" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" fill="#94E8E8">Full Stack Java Developer</text>

  <text x="90" y="245" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" fill="#3B7A8F">building with Java · Spring Boot · React — exploring AI</text>

  <text x="1110" y="270" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="18" fill="#0891B2" text-anchor="end" opacity="0.85">&lt;/developer&gt;</text>

  <g opacity="0.7">
    <circle cx="1080" cy="70" r="3" fill="#00F5FF"/>
    <circle cx="1105" cy="95" r="2" fill="#22D3EE"/>
    <circle cx="1055" cy="100" r="2" fill="#67E8F9"/>
    <circle cx="1120" cy="60" r="2" fill="#0891B2"/>
  </g>
</svg>
